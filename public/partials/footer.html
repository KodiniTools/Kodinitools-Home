<style>
.site-footer {
  background: #ffffff;
  border-top: 1px solid #AEAFB7;
  padding: 1.5rem 2rem;
  margin-top: 2rem;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
}

[data-theme="dark"] .site-footer {
  background: #16161c;
  border-top-color: #5E5F69;
}

.footer-content {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
}

.footer-links {
  display: flex;
  gap: 1.5rem;
  flex-wrap: wrap;
  justify-content: center;
}

.footer-link {
  color: #5E5F69;
  text-decoration: none;
  font-size: 0.85rem;
  transition: color 0.2s ease;
  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  padding: 0;
}

[data-theme="dark"] .footer-link {
  color: #AEAFB7;
}

.footer-link:hover {
  color: #A28680;
}

[data-theme="dark"] .footer-link:hover {
  color: #F2E28E;
}

.footer-copyright {
  color: #AEAFB7;
  font-size: 0.8rem;
  margin: 0;
}

[data-theme="dark"] .footer-copyright {
  color: #5E5F69;
}

@media (max-width: 768px) {
  .site-footer {
    padding: 1.25rem 1rem;
  }
  .footer-links {
    gap: 1rem;
  }
  .footer-link {
    font-size: 0.8rem;
  }
}

@media (max-width: 480px) {
  .footer-links {
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
  }
}
</style>

<footer class="site-footer">
  <div class="footer-content">
    <div class="footer-links">
      <a href="https://kodinitools.com/datenschutz/" class="footer-link">Datenschutz</a>

      <button class="footer-link" onclick="CookieConsent.showSettings()">Cookie-Einstellungen</button>
    </div>
    <p class="footer-copyright">&copy; <script>document.write(new Date().getFullYear())</script> KodiniTools</p>
  </div>
</footer>
