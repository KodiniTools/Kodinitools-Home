<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schriftarten Vergleich - KodiniTools</title>

    <style>
        @font-face {
            font-family: 'Supreme';
            src: url('/fonts/Supreme-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f9f2d5 0%, #f8e1a9 100%);
            min-height: 100vh;
            padding: 2rem;
            font-family: 'Supreme', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: #003971;
        }

        .font-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .font-card {
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid rgba(0,0,0,0.06);
        }

        .font-name {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #4f6f8e;
            margin-bottom: 1rem;
        }

        .font-demo h2 {
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
            color: #003971;
        }

        .font-demo h3 {
            font-size: 1.1rem;
            margin-bottom: 0.75rem;
            color: #014f99;
            font-weight: 600;
        }

        .font-demo p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #014f99;
            margin-bottom: 1rem;
        }

        .font-demo .small {
            font-size: 0.8rem;
            color: #4f6f8e;
        }

        .recommendation {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            font-size: 0.65rem;
            margin-left: 0.5rem;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <h1>Schriftarten Vergleich</h1>

    <div class="font-grid">
        <!-- Supreme -->
        <div class="font-card">
            <div class="font-name">Supreme <span class="recommendation">Aktiv</span></div>
            <div class="font-demo">
                <h2>KodiniTools</h2>
                <h3>Kostenlose Audio & Bild Tools</h3>
                <p>Professionelle Audio- und Bildbearbeitungstools kostenlos im Browser. MP3 Konverter, Audio Equalizer, Bildkonverter und mehr.</p>
                <p class="small">Keine Installation erforderlich - direkt im Browser nutzen.</p>
            </div>
        </div>
    </div>
</body>
</html>
