  <script>
    function loadGA4() {
      if (window.ga4Loaded) return;
      window.ga4Loaded = true;
      var script = document.createElement('script');
      script.src = "https://www.googletagmanager.com/gtag/js?id=G-XRB3KB1549";

      document.head.appendChild(script);
      script.onload = function() {
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', 'G-XRB3KB1549');
      };
    }
    document.addEventListener('cookieyes_consent_update', function(event) {
      var consent = event.detail;
      if (consent && consent.accepted && consent.accepted.includes('analytics')) {
        loadGA4();
      }
    });
    window.addEventListener('load', function() {
      var ckyConsent = document.cookie.match(/cookieyes-consent=([^;]+)/);
      if (ckyConsent) {
        try {
          var consent = decodeURIComponent(ckyConsent[1]);
          if (consent.includes('analytics:yes')) { loadGA4(); }
        } catch(e) {}
      }
    });
  </script>
